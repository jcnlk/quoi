name: Build

on:
  push:
    branches:
      - "multiversion"
    paths:
      - ".forgejo/workflows/build.yml"
      - "gradle/**"
      - "src/**"
      - "versions/**"
      - "build.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "LICENSE"
      - "settings.gradle.kts"
      - "stonecutter.gradle.kts"
  pull_request:
    # This required merge check must also run for documentation-only PRs.
    branches: [multiversion]

permissions:
  contents: read

concurrency:
  group: build-${{ forgejo.workflow }}-${{ forgejo.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set Up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: enhanced
          cache-read-only: ${{ forgejo.event_name != 'push' }}
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Build Mod
        run: ./gradlew buildAll --build-cache --configuration-cache --stacktrace
        env:
          FORGEJO_TOKEN: ""
          GITHUB_TOKEN: ""

      - name: Upload Build Artifacts
        if: ${{ success() && forgejo.event_name == 'push' && forgejo.ref == 'refs/heads/multiversion' }}
        uses: https://code.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        with:
          name: quoi-build-artifacts
          path: build/libs/*/quoi-*.jar
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
