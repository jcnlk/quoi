name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check Out Repository
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a

      - name: Set Up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          cache-disabled: true

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Build Mod
        run: ./gradlew build validateAccessWidener --stacktrace

      - name: Stage Build Artifacts
        if: always()
        run: |
          rm -rf ci-artifacts
          mkdir -p ci-artifacts/reports
          find build/libs -maxdepth 1 -type f -name "*.jar" ! -name "*-sources.jar" -exec cp {} ci-artifacts/ \;
          if [ -d build/reports ]; then
            cp -R build/reports/. ci-artifacts/reports/
          fi

      - name: Upload Build Artifacts
        if: always()
        uses: forgejo/upload-artifact@v4
        with:
          name: quoi-build-artifacts
          path: |
            ci-artifacts/*
            ci-artifacts/reports/**
          if-no-files-found: warn
