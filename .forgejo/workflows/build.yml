name: Build

on:
  push:
    paths-ignore:
      - "**/*.md"
      - ".github/**"
      - ".gitignore"
      - ".run/**"
      - "LICENSE"
  pull_request:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check Out Repository
        uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6.2.0

      - name: Set Up Java 21
        uses: actions/setup-java@v5.4.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v6.2.0
        with:
          cache-provider: enhanced
          cache-read-only: ${{ github.event_name != 'push' }}

      - name: Build Mod
        run: ./gradlew build --build-cache --configuration-cache --stacktrace

      - name: Stage Build Artifacts
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || failure()) }}
        run: |
          rm -rf ci-artifacts
          mkdir -p ci-artifacts/reports
          if [ -d build/libs ]; then
            find build/libs -maxdepth 1 -type f -name "*.jar" ! -name "*-sources.jar" -exec cp {} ci-artifacts/ \;
          fi
          if [ -d build/reports ]; then
            cp -R build/reports/. ci-artifacts/reports/
          fi

      - name: Upload Build Artifacts
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || failure()) }}
        # v5/v6 currently fail on Forgejo 1.22 / runner 12.12 with
        # "Error unauthorized" during blob upload. Keep v4 until the
        # Forgejo artifact backend supports the newer upload flow.
        uses: forgejo/upload-artifact@v4
        with:
          name: quoi-build-artifacts
          path: ci-artifacts/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14

      - name: Add Artifact Link
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        run: |
          title="Build artifacts"
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            title="Nightly artifacts"
          fi
          repo_path="${GITHUB_REPOSITORY#git.jcnlk.com/}"
          {
            echo "### ${title}"
            echo ""
            echo "[Open actions](https://git.jcnlk.com/${repo_path}/actions)"
          } >> "$GITHUB_STEP_SUMMARY"
