name: Build

on:
  push:
    branches:
      - "1.21.11"
      - "26.1.x"
      - "26.2"
    paths-ignore:
      - "**/*.md"
      - ".github/**"
      - ".gitignore"
      - ".run/**"
      - "LICENSE"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check Out Repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6.2.0

      - name: Set Up Java 25
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v6.2.0
        with:
          cache-provider: enhanced
          cache-read-only: ${{ github.event_name != 'push' }}
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Build Mod
        run: ./gradlew build --build-cache --configuration-cache --stacktrace

      - name: Upload Build Artifacts
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || failure()) }}
        # Forgejo 15 supports the patched v4 artifact action. Unlike v7,
        # it always archives uploads, so the ZIP is limited to the mod JAR.
        uses: forgejo/upload-artifact@v4
        with:
          name: quoi-build-artifacts
          path: |
            build/libs/quoi-*.jar
            !build/libs/quoi-*-sources.jar
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14
