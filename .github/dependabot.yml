version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    target-branch: "1.21.10"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    groups:
      gradle-1-21-10:
        patterns:
          - "*"

  - package-ecosystem: "gradle"
    directory: "/"
