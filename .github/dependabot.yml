version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    target-branch: "multiversion"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      gradle:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "multiversion"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"