name: Build

on:
  push:
    branches:
      - 1.21.10
      - 1.21.11
      - 26.1.x
      - 26.2
  pull_request:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check Out Repository
        uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6.2.0

      - name: Set Up Java 25
        uses: actions/setup-java@v5.4.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v6.2.0
        with:
          cache-provider: enhanced
          cache-read-only: ${{ github.event_name != 'push' }}

      - name: Build Mod
        run: ./gradlew build --stacktrace

      - name: Stage Build Artifacts
        if: always()
        run: |
          rm -rf ci-artifacts
          mkdir -p ci-artifacts/reports
          if [ -d build/libs ]; then
            find build/libs -maxdepth 1 -type f -name "*.jar" ! -name "*-sources.jar" -exec cp {} ci-artifacts/ \;
          fi
          if [ -d build/reports ]; then
            cp -R build/reports/. ci-artifacts/reports/
          fi

      - name: Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: quoi-build-artifacts
          path: ci-artifacts/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14

      - name: Add Artifact Link
        if: always()
        run: |
          title="Build artifacts"
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            title="Nightly artifacts"
          fi
          {
            echo "### ${title}"
            echo ""
            echo "[Open artifacts for this run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
          } >> "$GITHUB_STEP_SUMMARY"
