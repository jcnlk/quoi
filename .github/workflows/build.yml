name: Build

on:
  push:
    branches: [multiversion]
    paths: &build-paths
      - ".github/workflows/build.yml"
      - "gradle/**"
      - "src/**"
      - "versions/**"
      - "build.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "LICENSE"
      - "settings.gradle.kts"
      - "stonecutter.gradle.kts"
  pull_request:
    paths: *build-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set Up Java 25
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: enhanced
          cache-read-only: ${{ github.event_name != 'push' }}

      - name: Build All Minecraft Targets
        run: ./gradlew buildAll --build-cache --configuration-cache --stacktrace

      - name: Upload Minecraft 26.2 JAR
        if: ${{ success() && github.ref == 'refs/heads/multiversion' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: build/libs/26.2/quoi-*.jar
          if-no-files-found: error
          archive: false
          retention-days: 90

      - name: Upload Minecraft 26.3 JAR
        if: ${{ success() && github.ref == 'refs/heads/multiversion' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: build/libs/26.3/quoi-*.jar
          if-no-files-found: error
          archive: false
          retention-days: 90

      - name: Upload Minecraft 26.4 JAR
        if: ${{ success() && github.ref == 'refs/heads/multiversion' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: build/libs/26.4/quoi-*.jar
          if-no-files-found: error
          archive: false
          retention-days: 90
