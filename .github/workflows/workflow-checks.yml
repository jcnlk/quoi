name: Workflow checks

on:
  push:
    branches: [multiversion]
    paths: &workflow-paths
      - ".github/workflows/**"
      - ".forgejo/workflows/**"
  pull_request:
    branches: [multiversion]
    paths: *workflow-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflow-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint GitHub Workflows
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color

      - name: Lint Forgejo Workflows
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          entrypoint: /bin/sh
          # The runner parses args with .NET rules, so quote the script with double quotes.
          # Translate Forgejo's context alias and action URL syntax for actionlint.
          # Security auditing below reads the original files.
          args: >-
            -ec "
            for workflow in .forgejo/workflows/*.yml .forgejo/workflows/*.yaml; do
              [ -f \"$workflow\" ] || continue;
              sed -e \"s#uses: https://code.forgejo.org/#uses: #\" -e \"s/forgejo\\./github./g\" \"$workflow\" | actionlint -color -stdin-filename \"$workflow\" - || exit \"$?\";
            done"

      - name: Audit GitHub Workflow Security
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          inputs: .github/workflows
          advanced-security: false
          annotations: true

      - name: Audit Forgejo Workflow Security
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          # Directory discovery skips .forgejo; GitHub's online audits cannot resolve Forgejo action URLs.
          inputs: .forgejo/workflows/*.y*ml
          online-audits: false
          advanced-security: false
          annotations: true
