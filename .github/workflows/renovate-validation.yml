name: Renovate validation

on:
  push:
    branches: [multiversion]
    paths:
      - "renovate.json"
      - ".github/workflows/renovate-validation.yml"
  pull_request:
    paths:
      - "renovate.json"
      - ".github/workflows/renovate-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # renovate: datasource=npm depName=renovate
      RENOVATE_VERSION: "44.178.5"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      - name: Validate Renovate configuration
        run: npx --yes --package "renovate@$RENOVATE_VERSION" -- renovate-config-validator --strict --no-global renovate.json
