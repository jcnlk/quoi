# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
tone_instructions: "Keep feedback concise and actionable. Prioritize correctness, security, and Minecraft version compatibility. Explain the concrete failure behind each finding."

reviews:
  profile: chill
  request_changes_workflow: false
  collapse_walkthrough: true
  auto_review:
    enabled: true
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 0
    drafts: false
    ignore_usernames: []
  pre_merge_checks:
    docstrings:
      mode: "off"
  path_instructions:
    - path: "src/**"
      instructions: |
        This is a Fabric client mod targeting Minecraft 26.2, 26.3, and 26.4 snapshots through Stonecutter.
        Interpret Stonecutter condition comments and replacements in stonecutter.gradle.kts before evaluating version-specific code.
        Check event consumption, render state, client-thread access, and behavior across the supported Minecraft targets.
    - path: "**/gradle.properties"
      instructions: |
        Review dependency updates against each target's Minecraft version, Fabric API suffix, Mod Menu major, and Fabric Kotlin runtime.
        Minecraft supplies libraries such as Netty, Log4j, and LWJGL; evaluate runtime and native ABI compatibility when reviewing their versions.
    - path: "**/*.gradle.kts"
      instructions: |
        Account for Stonecutter preprocessing, target-specific source exclusions, Java 25, and the shared source tree.
        Verify that buildAll still produces a separate JAR for each of the three Minecraft targets.
    - path: ".github/workflows/**"
      instructions: |
        Review event and path filters, token permissions, cache trust, and pinned action references.
        The Build workflow distributes downloadable JARs through GitHub Actions artifacts.
    - path: ".forgejo/workflows/**"
      instructions: |
        Review Forgejo event filters, context expressions, runner compatibility, cache trust, and pinned action URLs.
        Only successful pushes to multiversion may publish downloadable JARs. Forgejo's build does not run GitHub CodeQL.
